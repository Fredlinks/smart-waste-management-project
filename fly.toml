# Fly.io configuration
# https://fly.io/docs/reference/configuration/
app = "cleancollect"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "3000"
  DATA_DIR = "/var/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/api/health"

[[mounts]]
  source = "cleancollect_data"
  destination = "/var/data"

[volumes]
  [volumes.cleancollect_data]
    size_gb = 1
